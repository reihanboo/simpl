name: Build and Deploy to OKE

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-oke
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.OCIR_REGISTRY }}
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
  K8S_NAMESPACE: simpl

jobs:
  build-and-push:
    name: Build and push images to OCIR
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-backend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to OKE
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    env:
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl for OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Ensure namespace
        run: kubectl apply -f deploy/k8s/namespace.yaml

      - name: Sync application secret
        env:
          DB_USER: postgres
          DB_NAME: simpl_db
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEEPSEEK_API: ${{ secrets.DEEPSEEK_API }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MIDTRANS_SERVER_KEY: ${{ secrets.MIDTRANS_SERVER_KEY }}
          AI_DB_USER: ${{ secrets.AI_DB_USER }}
          AI_DB_PASSWORD: ${{ secrets.AI_DB_PASSWORD }}
        run: |
          kubectl -n "$K8S_NAMESPACE" create secret generic simpl-secrets \
            --from-literal=DB_USER="$DB_USER" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=DB_NAME="$DB_NAME" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=DEEPSEEK_API="$DEEPSEEK_API" \
            --from-literal=RESEND_API_KEY="$RESEND_API_KEY" \
            --from-literal=MIDTRANS_SERVER_KEY="$MIDTRANS_SERVER_KEY" \
            --from-literal=AI_DB_USER="$AI_DB_USER" \
            --from-literal=AI_DB_PASSWORD="$AI_DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync image pull secret
        env:
          OCIR_USERNAME: ${{ secrets.OCIR_USERNAME }}
          OCIR_AUTH_TOKEN: ${{ secrets.OCIR_AUTH_TOKEN }}
        run: |
          kubectl -n "$K8S_NAMESPACE" create secret docker-registry ocir-pull \
            --docker-server="$REGISTRY" \
            --docker-username="$OCIR_USERNAME" \
            --docker-password="$OCIR_AUTH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render and apply manifests
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-backend:${{ needs.build-and-push.outputs.tag }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.OCIR_NAMESPACE }}/simpl-frontend:${{ needs.build-and-push.outputs.tag }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          command -v envsubst >/dev/null || { sudo apt-get update && sudo apt-get install -y gettext-base; }
          mkdir -p /tmp/k8s
          for file in deploy/k8s/*.yaml; do
            envsubst '${BACKEND_IMAGE} ${FRONTEND_IMAGE} ${FRONTEND_URL}' < "$file" > "/tmp/k8s/$(basename "$file")"
          done
          kubectl apply -f /tmp/k8s/

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/simpl-backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/simpl-frontend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" get svc,deploy,statefulset
