apiVersion: apps/v1
kind: Deployment
metadata:
  name: simpl-frontend
  namespace: simpl
  labels:
    app: simpl-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simpl-frontend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: simpl-frontend
    spec:
      imagePullSecrets:
        - name: ocir-pull
      containers:
        - name: frontend
          image: ${FRONTEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: simpl-frontend
  namespace: simpl
  labels:
    app: simpl-frontend
spec:
  type: LoadBalancer
  selector:
    app: simpl-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
