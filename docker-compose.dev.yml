services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: simpl-backend-dev
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    environment:
      - PORT=${BACKEND_PORT:-8080}
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: simpl-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_HMR_CLIENT_PORT=${FRONTEND_PORT:-3000}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
